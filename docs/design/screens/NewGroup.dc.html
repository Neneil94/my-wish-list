<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anlass erstellen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5F4A}a:hover{color:#174A39}
.h{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;font:600 16px Inter,sans-serif;text-decoration:none;border:0;box-sizing:border-box;padding:0 18px}
.btn-p{background:#1F5F4A;color:#fff}.btn-p:hover{color:#fff;background:#174A39}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font:600 14px Inter,sans-serif;color:#17181C}
.inp{height:48px;border:1px solid #CFCBC2;border-radius:12px;padding:0 14px;font:400 16px Inter,sans-serif;color:#17181C;background:#fff;box-sizing:border-box;width:100%}
.ta{height:88px;padding:12px 14px;resize:none;line-height:1.4}
.hint{font:400 13px/1.45 Inter,sans-serif;color:#5B5E66;margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:#fff;cursor:pointer;text-align:left;width:100%;box-sizing:border-box;font-family:Inter,sans-serif}
.radio{width:20px;height:20px;border-radius:999px;box-sizing:border-box;flex-shrink:0;margin-top:1px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F4F0;font-family:Inter,sans-serif;color:#17181C;display:flex;flex-direction:column;padding:16px 20px 28px;gap:20px">
<div style="display:flex;align-items:center;justify-content:space-between">
<a href="Groups.dc.html" aria-label="Schließen" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</a>
<span style="font:600 15px Inter,sans-serif">Neuer Anlass</span>
<span style="width:44px"></span>
</div>
<form style="display:flex;flex-direction:column;gap:18px">
<div class="field">
<label class="lbl" for="n">Name des Anlasses</label>
<input class="inp" id="n" type="text" maxlength="60" value="Weihnachten 2026">
</div>
<div class="field">
<label class="lbl" for="dt">Datum</label>
<input class="inp" id="dt" type="date" value="2026-12-24">
<p class="hint">Nach dem Datum wird der Anlass automatisch archiviert.</p>
</div>
<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
<legend class="lbl" style="margin-bottom:8px">Wer bekommt Geschenke?</legend>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
<button type="button" class="opt" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="border:{{o.border}}">
<span class="radio" style="border:{{o.ring}}"></span>
<span style="display:flex;flex-direction:column;gap:3px">
<span style="font:600 15px Inter,sans-serif;color:#17181C">{{o.t}}</span>
<span class="hint">{{o.d}}</span>
</span>
</button>
</sc-for>
</fieldset>
<div class="field">
<label class="lbl" for="ds">Beschreibung <span style="font-weight:400;color:#5B5E66">(optional)</span></label>
<textarea class="inp ta" id="ds" maxlength="500">Wichteln bei Oma, Budget ca. 50 € pro Person.</textarea>
</div>
</form>
<div style="flex-grow:1"></div>
<a class="btn btn-p" href="Members.dc.html">Erstellen &amp; Mitglieder einladen</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { mode: 'all' }; }
  renderVals() {
    const list = [
      { id: 'all', t: 'Alle Mitglieder', d: 'Jede Person pflegt eine eigene Wunschliste – z. B. Weihnachten.' },
      { id: 'some', t: 'Bestimmte Person(en)', d: 'Nur Geehrte haben eine Liste – z. B. Geburtstag, Hochzeit.' }
    ];
    return {
      opts: list.map(o => {
        const on = this.state.mode === o.id;
        return { ...o, on: on ? 'true' : 'false',
          border: on ? '2px solid #1F5F4A' : '1px solid #E4E2DC',
          ring: on ? '6px solid #1F5F4A' : '2px solid #A8A49B',
          pick: () => this.setState({ mode: o.id }) };
      })
    };
  }
}
</script>
</body>
</html>
