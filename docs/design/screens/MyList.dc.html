<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Meine Wunschliste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5F4A}a:hover{color:#174A39}
.h{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;font:600 16px Inter,sans-serif;text-decoration:none;border:0;box-sizing:border-box;padding:0 18px;cursor:pointer}
.btn-p{background:#1F5F4A;color:#fff}.btn-p:hover{color:#fff;background:#174A39}
.btn-g{background:transparent;color:#1F5F4A;height:44px;font-size:14px}
.hint{font:400 13px/1.45 Inter,sans-serif;color:#5B5E66;margin:0}
.card{background:#fff;border:1px solid #E4E2DC;border-radius:16px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;text-decoration:none;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font:600 12px Inter,sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F4F0;font-family:Inter,sans-serif;color:#17181C;display:flex;flex-direction:column;padding:12px 20px 24px;gap:14px;overflow:hidden">
<div style="display:flex;align-items:center;gap:4px;margin-left:-10px">
<a class="ib" href="GroupDetail.dc.html" aria-label="Zurück zum Anlass"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display:flex;flex-direction:column">
<h1 class="h" style="font-size:24px;font-weight:700">Meine Wunschliste</h1>
<span class="hint">Weihnachten 2026 · 4 Wünsche</span>
</div>
</div>

<div style="display:flex;gap:12px;align-items:flex-start;background:#FCEBDD;border:1px solid #F3CBAE;border-radius:14px;padding:12px 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A3E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:1px"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9"></path><path d="M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
<p style="margin:0;font:400 13px/1.45 Inter,sans-serif;color:#5C2A07"><b>Überraschungsschutz aktiv.</b> Ob und von wem deine Wünsche beansprucht wurden, siehst du nicht – auch nicht als Admin.</p>
</div>

<sc-for list="{{wishes}}" as="w" hint-placeholder-count="4">
<div class="card" style="display:flex;gap:12px;padding:14px 6px 14px 16px;align-items:flex-start">
<div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span style="font:600 15px Inter,sans-serif">{{w.title}}</span>
<sc-if value="{{w.top}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background:#E3EFE9;color:#174A39">Top-Wunsch</span></sc-if>
</div>
<span class="hint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{w.desc}}</span>
<div style="display:flex;gap:12px;align-items:center">
<span style="font:600 14px Inter,sans-serif;color:#17181C">{{w.price}}</span>
<sc-if value="{{w.domain}}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:4px;font:500 13px Inter,sans-serif;color:#1F5F4A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>{{w.domain}}</span></sc-if>
</div>
</div>
<a class="ib" href="WishForm.dc.html" aria-label="Wunsch bearbeiten"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3D4048" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></a>
</div>
</sc-for>

<div style="flex-grow:1"></div>
<a class="btn btn-p" href="WishForm.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Wunsch hinzufügen</a>
<a class="btn btn-g" href="MyList.dc.html">Aus einer anderen Liste übernehmen</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      wishes: [
        { title: 'Siebträger-Espressomaschine', desc: 'Gern mit Milchaufschäumer, Farbe Edelstahl', price: 'ca. 449 €', domain: 'kaffee-shop.de', top: true },
        { title: 'Wanderschuhe Gr. 44', desc: 'Wasserdicht, eher breiter Leisten', price: '160 €', domain: 'outdoor-laden.de', top: false },
        { title: 'Zeit zu zweit', desc: 'Ein gemeinsamer Ausflug – Ideen willkommen', price: 'ohne Preis', domain: '', top: false },
        { title: 'Kochkurs Thai-Küche', desc: 'Volkshochschule oder privat', price: '85 €', domain: 'vhs-beispiel.de', top: false }
      ]
    };
  }
}
</script>
</body>
</html>
