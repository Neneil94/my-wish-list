<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Beanspruchen oder beitragen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5F4A}a:hover{color:#174A39}
.h{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;font:600 16px Inter,sans-serif;text-decoration:none;border:0;box-sizing:border-box;padding:0 18px;cursor:pointer}
.btn-p{background:#1F5F4A;color:#fff}.btn-p:hover{color:#fff;background:#174A39}
.lbl{font:600 14px Inter,sans-serif;color:#17181C}
.inp{height:52px;border:1px solid #CFCBC2;border-radius:12px;padding:0 40px 0 14px;font:600 20px Inter,sans-serif;color:#17181C;background:#fff;box-sizing:border-box;width:100%}
.inp2{height:48px;border:1px solid #CFCBC2;border-radius:12px;padding:0 14px;font:400 15px Inter,sans-serif;color:#17181C;background:#fff;box-sizing:border-box;width:100%}
.hint{font:400 13px/1.45 Inter,sans-serif;color:#5B5E66;margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:#fff;cursor:pointer;text-align:left;width:100%;box-sizing:border-box;font-family:Inter,sans-serif}
.radio{width:20px;height:20px;border-radius:999px;box-sizing:border-box;flex-shrink:0;margin-top:1px}
.chip{height:40px;padding:0 14px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;border:1px solid #CFCBC2;background:#fff;color:#17181C}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F4F0;font-family:Inter,sans-serif;color:#17181C;display:flex;flex-direction:column;padding:16px 20px 24px;gap:16px;overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between">
<a href="WishDetail.dc.html" aria-label="Schließen" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
</a>
<span style="font:600 15px Inter,sans-serif">{{heading}}</span>
<span style="width:44px"></span>
</div>
<div class="card" style="background:#fff;border:1px solid #E4E2DC;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px">
<span class="hint">Lenas Wunsch</span>
<span style="font:600 16px Inter,sans-serif">Noise-Cancelling-Kopfhörer · 199 €</span>
<div style="height:8px;border-radius:4px;background:#EFEDE8;overflow:hidden" aria-hidden="true"><div style="height:8px;background:#E07B39;width:{{pct}}"></div></div>
<span class="hint">{{covered}}</span>
</div>

<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">
<legend class="lbl" style="margin-bottom:8px">Wie möchtest du schenken?</legend>
<sc-for list="{{modes}}" as="o" hint-placeholder-count="2">
<button type="button" class="opt" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="border:{{o.border}}">
<span class="radio" style="border:{{o.ring}}"></span>
<span style="display:flex;flex-direction:column;gap:3px"><span style="font:600 15px Inter,sans-serif;color:#17181C">{{o.t}}</span><span class="hint">{{o.d}}</span></span>
</button>
</sc-for>
</fieldset>

<sc-if value="{{share}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:8px">
<label class="lbl" for="amt">Dein Beitrag</label>
<div style="position:relative"><input class="inp" id="amt" type="text" inputmode="decimal" value="{{amount}}" onChange="{{onAmt}}"><span style="position:absolute;right:14px;top:14px;font:600 20px Inter,sans-serif;color:#5B5E66" aria-hidden="true">€</span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{q.pick}}">{{q.label}}</button></sc-for>
</div>
</div>
</sc-if>

<div style="display:flex;flex-direction:column;gap:6px">
<label class="lbl" for="nt">Notiz an Mitschenkende <span style="font-weight:400;color:#5B5E66">(optional)</span></label>
<input class="inp2" id="nt" type="text" maxlength="200" placeholder="z. B. Ich bestelle bis 1.12.">
</div>
<div style="flex-grow:1"></div>
<div style="display:flex;gap:8px;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#174A39" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9"></path><path d="M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path></svg>
<span style="font:500 13px Inter,sans-serif;color:#174A39">Lena sieht deine Zusage nicht.</span>
</div>
<a class="btn btn-p" href="WishDetail.dc.html">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["Erste Zusage","Mitmachen"],"default":"Erste Zusage"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { mode: 'share', amount: '50' }; }
  renderVals() {
    const join = (this.props.variant ?? 'Erste Zusage') === 'Mitmachen';
    const covered = join ? 160 : 0;
    const rest = 199 - covered;
    const share = this.state.mode === 'share';
    const modes = join
      ? [{ id: 'full', t: 'Restbetrag übernehmen (' + rest + ' €)', d: 'Damit ist der Wunsch vollständig gedeckt.' },
         { id: 'share', t: 'Teilbetrag beisteuern', d: 'Du wählst, wie viel du gibst.' }]
      : [{ id: 'full', t: 'Ich schenke es komplett', d: 'Der Wunsch ist dann für alle anderen vergeben.' },
         { id: 'share', t: 'Gruppengeschenk starten', d: 'Du gibst einen Teil, andere können sich anschließen.' }];
    return {
      heading: join ? 'Beim Gruppengeschenk mitmachen' : 'Wunsch beanspruchen',
      pct: Math.round(covered / 199 * 100) + '%',
      covered: join ? '160 € von 199 € gedeckt · 3 Personen' : 'Noch niemand hat zugesagt',
      share,
      amount: this.state.amount,
      onAmt: (e) => this.setState({ amount: e.target.value }),
      quick: [20, 30, 50].map(v => ({ label: v + ' €', pick: () => this.setState({ amount: String(v) }) })).concat([{ label: 'Rest ' + rest + ' €', pick: () => this.setState({ amount: String(rest) }) }]),
      modes: modes.map(o => {
        const on = this.state.mode === o.id;
        return { ...o, pressed: on ? 'true' : 'false', border: on ? '2px solid #1F5F4A' : '1px solid #E4E2DC', ring: on ? '6px solid #1F5F4A' : '2px solid #A8A49B', pick: () => this.setState({ mode: o.id }) };
      }),
      cta: share ? ('Verbindlich ' + (this.state.amount || '0') + ' € zusagen') : (join ? 'Rest übernehmen' : 'Komplett beanspruchen')
    };
  }
}
</script>
</body>
</html>
