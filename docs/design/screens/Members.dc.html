<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mitglieder und Einladen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5F4A}a:hover{color:#174A39}
.h{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:12px;font:600 14px Inter,sans-serif;text-decoration:none;border:0;box-sizing:border-box;padding:0 14px;cursor:pointer}
.btn-p{background:#1F5F4A;color:#fff}
.btn-s{background:#fff;color:#17181C;border:1px solid #CFCBC2}
.lbl{font:600 14px Inter,sans-serif;color:#17181C}
.inp{height:48px;border:1px solid #CFCBC2;border-radius:12px;padding:0 14px 0 42px;font:400 16px Inter,sans-serif;color:#17181C;background:#fff;box-sizing:border-box;width:100%}
.hint{font:400 13px/1.45 Inter,sans-serif;color:#5B5E66;margin:0}
.card{background:#fff;border:1px solid #E4E2DC;border-radius:16px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;text-decoration:none;border:0;background:transparent;cursor:pointer}
.sec{font:600 12px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#5B5E66;margin:0}
.m{display:flex;align-items:center;gap:12px;padding:8px 6px 8px 14px;min-height:56px;box-sizing:border-box}
.m+.m{border-top:1px solid #EFEDE8}
.av{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:700 12px Inter,sans-serif;color:#fff;flex-shrink:0}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font:600 11px Inter,sans-serif}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F4F0;font-family:Inter,sans-serif;color:#17181C;display:flex;flex-direction:column;padding:12px 20px 20px;gap:16px;overflow:hidden">
<div style="display:flex;align-items:center;gap:4px;margin-left:-10px">
<a class="ib" href="GroupDetail.dc.html" aria-label="Zurück zum Anlass"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="display:flex;flex-direction:column">
<h1 class="h" style="font-size:24px;font-weight:700">Mitglieder</h1>
<span class="hint">Weihnachten 2026</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<label class="lbl" for="q">Person einladen</label>
<div style="position:relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B5E66" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:14px;top:15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input class="inp" id="q" type="text" autocapitalize="none" spellcheck="false" placeholder="Exakter Username, z. B. oma.helga" value="{{q}}" onChange="{{onQ}}">
</div>
<p class="hint">Aus Datenschutzgründen gibt es keine Vorschläge – nur exakte Treffer.</p>
<sc-if value="{{found}}" hint-placeholder-val="{{ true }}">
<div class="card" style="display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px">
<span class="av" style="background:#6B4E8A">HE</span>
<div style="flex:1;display:flex;flex-direction:column"><span style="font:600 15px Inter,sans-serif">Helga</span><span class="hint">@oma.helga</span></div>
<button class="btn btn-p" type="button" onClick="{{invite}}">{{inviteLabel}}</button>
</div>
</sc-if>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<p class="hint" style="color:#3D4048">Kein Konto mit diesem Username gefunden.</p>
</sc-if>
</div>

<p class="sec">Eingeladen · wartet auf Annahme</p>
<div class="card">
<div class="m">
<span class="av" style="background:#A8A49B">OP</span>
<div style="flex:1;display:flex;flex-direction:column"><span style="font:600 15px Inter,sans-serif">@opa.kurt</span><span class="hint">eingeladen von dir · vor 2 Tagen</span></div>
<button class="btn" type="button" style="background:transparent;color:#B42318">Zurückziehen</button>
</div>
</div>

<p class="sec">Mitglieder · 6</p>
<div class="card">
<sc-for list="{{members}}" as="p" hint-placeholder-count="6">
<div class="m">
<span class="av" style="background:{{p.c}}">{{p.ini}}</span>
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font:600 15px Inter,sans-serif">{{p.name}}</span><span class="hint">{{p.user}}</span></div>
<sc-if value="{{p.admin}}" hint-placeholder-val="{{ false }}"><span class="pill" style="background:#E3EFE9;color:#174A39">Admin</span></sc-if>
<button class="ib" type="button" aria-label="Optionen für {{p.name}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="#5B5E66" aria-hidden="true"><circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle></svg></button>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { q: 'oma.helga', invited: false }; }
  renderVals() {
    const q = (this.state.q || '').trim().toLowerCase();
    const found = q === 'oma.helga';
    return {
      q: this.state.q,
      onQ: (e) => this.setState({ q: e.target.value, invited: false }),
      found, none: q.length >= 3 && !found,
      inviteLabel: this.state.invited ? 'Eingeladen' : 'Einladen',
      invite: () => this.setState({ invited: true }),
      members: [
        { name: 'Dominik (du)', user: '@dominik', ini: 'DO', c: '#1F5F4A', admin: true },
        { name: 'Lena', user: '@lena', ini: 'LE', c: '#8A3E0B', admin: true },
        { name: 'Max', user: '@max.b', ini: 'MA', c: '#3D4F8A', admin: false },
        { name: 'Mama', user: '@mama.b', ini: 'MM', c: '#6B4E8A', admin: false },
        { name: 'Papa', user: '@papa.b', ini: 'PA', c: '#1F5F4A', admin: false },
        { name: 'Paul', user: '@paul', ini: 'PL', c: '#5B5E66', admin: false }
      ]
    };
  }
}
</script>
</body>
</html>
