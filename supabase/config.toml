# Lokale Supabase-CLI-Konfiguration. Für das gehostete Projekt die gleichen
# Auth-Werte im Dashboard setzen (siehe README → "Supabase einrichten").
project_id = "my-wish-list"

[api]
schemas = ["public"]
max_rows = 500

[auth]
site_url = "https://neneil94.github.io/my-wish-list/"
# Öffentliche Registrierung AUS – Konten entstehen nur über die Edge Function.
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 12
# Keine Zeichenklassen-Pflicht hier: Die Edge Function erzwingt eigene Regeln
# (Buchstaben + Zahl ODER Sonderzeichen, HIBP-Check). Abweichende Supabase-Regeln
# würden gültige Registrierungen ablehnen.

[auth.email]
# true = E-Mail/Passwort-Provider aktiv (nötig für den Username-Login).
# Neue Konten verhindert das globale auth.enable_signup = false.
enabled = true
enable_confirmations = false
secure_password_change = true

[auth.rate_limit]
sign_in_sign_ups = 30

[functions.account]
# Die Funktion prüft JWTs selbst (öffentliche Aktionen brauchen keins).
verify_jwt = false
